<title>Tu regalo de Navidad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: una sola columna centrada, tarjeta de búsqueda arriba y revelación del regalo debajo */
:root{--bg:#f3faf5;--ink:#0d3b2a;--muted:#4f6b5d;--card:#ffffff;--line:#cfe5d6;--accent:#ffc533;--accent-ink:#2b2100;--green:#12a150;
--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:Inter,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08241a;--ink:#eaf8ef;--muted:#9bbcaa;--card:#0f3524;--line:#1f5a40;--color-scheme:dark;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08241a;--ink:#eaf8ef;--muted:#9bbcaa;--card:#0f3524;--line:#1f5a40;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
main{max-width:520px;margin:0 auto;display:grid;gap:22px}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:800 clamp(34px,9vw,52px)/1.02 var(--display);margin:6px 0 0;text-wrap:balance}
p.lead{color:var(--muted);margin:10px 0 0}
form{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{font-weight:600;font-size:14px}
input{font:inherit;padding:13px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:700 16px var(--body);padding:13px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:hover{filter:brightness(.96)}
.opts{display:grid;gap:8px}
.opts button{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;font-weight:600}
.msg{color:var(--muted);font-size:14px;min-height:1.4em}
.reveal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 22px;text-align:center;display:grid;gap:8px;justify-items:center}
.reveal .hi{font-size:15px;color:var(--muted)}
.reveal .big{font:800 clamp(40px,12vw,64px)/1 var(--display)}
.reveal.mochila .big{color:var(--green)}
.reveal .sub{max-width:34ch;color:var(--muted)}
.box{font-size:64px;line-height:1;animation:shake .5s ease-in-out infinite}
.reveal.pop .big,.reveal.pop .sub{animation:pop .5s ease-out both}
@keyframes shake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.box,.reveal.pop .big,.reveal.pop .sub{animation:none}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
</style>
<main>
  <header>
    <div class="eyebrow">Gelt España · Navidad 2026</div>
    <h1>Compi, descubre tu regalo</h1>
    <p class="lead">Escribe tu nombre y apellido y te decimos qué te ha tocado: sampling o mochila. Todos nos llevamos algo.</p>
  </header>
  <form id="f" autocomplete="off">
    <label for="n">Tu nombre</label>
    <input id="n" placeholder="Ej: Laura Aranda" required minlength="3">
    <button type="submit">Descubrir mi regalo</button>
    <div class="msg" id="m" aria-live="polite"></div>
    
  </form>
  <section id="r" hidden></section>
</main>
<canvas id="c"></canvas>

const $=id=>document.getElementById(id);
async function H(t){const b=new TextEncoder().encode("gelt-navidad-26|"+t.join(" "));const h=await crypto.subtle.digest("SHA-256",b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,20)}
async function look(q){const t=norm(q);const codes=new Set();
 for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){const k=await H([t[i],t[j]]);if(k in TAB)codes.add(TAB[k])}
 return codes}
$("f").addEventListener("submit",async e=>{e.preventDefault();$("r").hidden=true;
 const q=$("n").value.trim();
 if(norm(q).length<2){$("m").textContent="Escribe tu nombre y un apellido.";return}
 const c=await look(q);
 if(!c.size){$("m").textContent="No encontramos ese nombre. Prueba con tu nombre y primer apellido, tal como figura en la lista.";return}
 if(c.size>1||c.has(2)){$("m").textContent="Hay otra persona con un nombre parecido. Añade tu segundo apellido.";return}
 $("m").textContent="";show(q,c.has(1))});
